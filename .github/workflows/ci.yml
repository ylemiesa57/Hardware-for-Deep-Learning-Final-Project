name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what workspace/scripts/tests/ actually needs. The full
          # AccelForge environment (Spec/arch loading via _load_spec.py)
          # ships as the timeloopaccelergy/accelforge Docker image per
          # docker-compose.yaml and isn't installable standalone here --
          # cache_sim.py and plots.py's tests are self-contained and don't
          # need it.
          pip install pytest numpy matplotlib
      - name: Run test suite
        working-directory: workspace
        run: python -m pytest scripts/tests/ -v
